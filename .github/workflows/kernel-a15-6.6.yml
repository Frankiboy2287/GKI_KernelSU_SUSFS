name: Android 15 6.6 (小米15Pro专属)
permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      make_release:
        required: true
        type: boolean
        default: false
      version:
        required: false
        type: string
        default: ""
      use_zram:
        description: '是否开启更多ZRAM算法?'
        required: true
        type: boolean
        default: true
      onlyAk3:
        description: '仅上传AK3压缩包?(无boot,下载更快)'
        required: false
        type: boolean
        default: false
      build_time:
        description: '设置内核构建时间(格式见仓库说明)'
        required: false
        type: string
      # 新增：小米15Pro的defconfig文件名，必填
      mi_defconfig:
        required: true
        type: string
        default: "dada_defconfig"
      # 移除所有 KernelSU/SUSFS/BBG/KPM/一加8E 相关输入项

jobs:
  build-xiaomi15pro-a15-6-6:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 保留原有的sub_level和os_patch_level矩阵，按需删减
          - sub_level: "56"
            os_patch_level: "2024-11"
          - sub_level: "57"
            os_patch_level: "2024-12"
          - sub_level: "58"
            os_patch_level: "2025-01"
          - sub_level: "66"
            os_patch_level: "2025-02"
          - sub_level: "77"
            os_patch_level: "2025-03"
          - sub_level: "89"
            os_patch_level: "2025-06"
          - sub_level: "98"
            os_patch_level: "2025-09"
          - sub_level: "X"
            os_patch_level: "lts"
    # 核心修改：调用小米15Pro专属编译工作流（替换原gki-kernel.yml）
    uses: ./.github/workflows/gki-kernel.yml
    secrets: inherit
    with:
      make_release: ${{ inputs.make_release }}
      android_version: "android15"
      kernel_version: "6.6"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      version: ${{ inputs.version }}
      use_zram: ${{ inputs.use_zram }}
      onlyAk3: ${{ inputs.onlyAk3 }}
      build_time: ${{ inputs.build_time }}
      # 传递小米defconfig参数到专属编译工作流
      mi_defconfig: ${{ inputs.mi_defconfig }}
      # 移除所有 KernelSU/SUSFS/BBG/KPM/supp_op 相关参数
