name: Xiaomi15Pro Kernel Build (Add TMPFS Config)
permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      use_zram:
        required: true
        type: boolean
        default: true
      onlyAk3:
        required: true
        type: boolean
        default: false
      build_time:
        required: false
        type: string
      # 新增：小米内核defconfig名称，需自行确认后传入
      mi_defconfig:
        required: true
        type: string
        default: "dada_defconfig"

jobs:
  build-xiaomi-kernel:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      # 定义小米defconfig变量
      MI_DEFCONFIG: ${{ inputs.mi_defconfig }}

    steps:
      - name: Maximize Build Space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-swapfile: 'true'
          remove-cached-tools: 'false'
          verbose: 'true'

      - name: 安装编译依赖
        run: sudo apt update && sudo apt upgrade -y && sudo apt install -y ccache python3 git curl build-essential libssl-dev bison flex libelf-dev dwarves

      - name: 配置 ccache
        run: |
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 还原ccache缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-xiaomi-ccache-${{ github.sha }}
          restore-keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-xiaomi-ccache-

      - name: 缓存工具链
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            kernel-build-tools
            mkbootimg
            gcc
          key: xiaomi-toolchain-${{ runner.os }}-v1

      - name: 下载工具链和交叉编译器
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          # 复用原GKI工具链（mkbootimg/avbtool）
          AOSP_MIRROR=https://android.googlesource.com
          BRANCH=main-kernel-build-2024
          git clone $AOSP_MIRROR/kernel/prebuilts/build-tools -b $BRANCH --depth 1 kernel-build-tools
          git clone $AOSP_MIRROR/platform/system/tools/mkbootimg -b $BRANCH --depth 1 mkbootimg
          # 下载小米内核常用的交叉编译器（aarch64-linux-gnu-6.4.1）
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1.git gcc

      - name: 设置工具链环境变量
        run: |
          echo "AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool" >> $GITHUB_ENV
          echo "MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py" >> $GITHUB_ENV
          echo "UNPACK_BOOTIMG=$GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$GITHUB_WORKSPACE/gcc/bin/aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV

      - name: 配置 Git
        run: |
          git config --global user.name "zzh20188"
          git config --global user.email "BuildGkiKernel@gmail.com"

      - name: 生成签名密钥
        env:
          BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 > ./kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem
          echo "BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem" >> $GITHUB_ENV

      - name: 克隆小米15 Pro内核源码
        run: |
          git clone https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b dada-v-oss --depth 1 kernel-src
          cd kernel-src
          # 确认defconfig是否存在（替换为你的实际defconfig名）
          if [ ! -f arch/arm64/configs/$MI_DEFCONFIG ]; then
            echo "错误：defconfig文件 $MI_DEFCONFIG 不存在！"
            exit 1
          fi

      - name: 克隆AnyKernel3（可选，用于打包刷入包）
        if: ${{ !inputs.onlyAk3 }}
        run: |
          git clone https://github.com/WildPlusKernel/AnyKernel3.git -b gki-2.0

      - name: 添加 CONFIG_TMPFS_XATTR 和 CONFIG_TMPFS_POSIX_ACL
        run: |
          cd kernel-src
          # 写入两个目标CONFIG到defconfig
          echo "CONFIG_TMPFS_XATTR=y" >> arch/arm64/configs/$MI_DEFCONFIG
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> arch/arm64/configs/$MI_DEFCONFIG
          # 验证是否写入成功
          grep -E "CONFIG_TMPFS_XATTR|CONFIG_TMPFS_POSIX_ACL" arch/arm64/configs/$MI_DEFCONFIG

      - name: 配置内核编译时间（可选）
        run: |
          cd kernel-src
          CURRENT_TIME="${{ inputs.build_time }}"
          if [ -z "$CURRENT_TIME" ]; then
            CURRENT_TIME=$(date -u +"%a %b %d %H:%M:%S UTC %Y")
          fi
          # 修改编译时间
          perl -pi -e "s{UTS_VERSION=\"\\\$\(echo \\\$UTS_VERSION \\\$CONFIG_FLAGS \\\$TIMESTAMP \\| cut -b -\\\$UTS_LEN\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $CURRENT_TIME\"}" scripts/mkcompile_h
          # 移除dirty标记
          sed -i 's/-dirty//' scripts/setlocalversion

      - name: 编译内核（带重试）
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 40
          max_attempts: 3
          retry_on: timeout
          command: |
            cd kernel-src
            # 生成配置
            make $MI_DEFCONFIG CC="ccache ${CROSS_COMPILE}gcc"
            # 编译内核和Image
            make -j$(nproc --all) Image Image.gz Image.lz4 CC="ccache ${CROSS_COMPILE}gcc" LD="${CROSS_COMPILE}ld" AR="${CROSS_COMPILE}ar"
            # 验证产物
            if [ ! -f arch/arm64/boot/Image ]; then
              echo "编译失败：未生成Image文件！"
              exit 1
            fi

      - name: 复制编译产物
        run: |
          mkdir -p bootimgs
          cd kernel-src
          cp arch/arm64/boot/Image ../bootimgs/
          cp arch/arm64/boot/Image.gz ../bootimgs/
          cp arch/arm64/boot/Image.lz4 ../bootimgs/
          cp arch/arm64/boot/Image ../
          cp arch/arm64/boot/Image.gz ../
          cp arch/arm64/boot/Image.lz4 ../

      - name: 打包AnyKernel3刷入包
        if: ${{ !inputs.onlyAk3 }}
        run: |
          cd AnyKernel3
          mv ../Image ./
          ZIP_NAME="Xiaomi15Pro-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-AnyKernel3.zip"
          zip -r "../$ZIP_NAME" ./*

      - name: 生成boot.img（基于官方GKI ramdisk，适配小米设备可替换为官方ramdisk）
        run: |
          cd bootimgs
          # 下载小米15 Pro对应安卓版本的GKI ramdisk（或替换为官方提取的ramdisk）
          # 此处用安卓14的fallback示例，需自行替换为小米15 Pro的ramdisk
          if [ "${{ inputs.android_version }}" = "android14" ]; then
            curl -Lo gki.zip https://dl.google.com/android/gki/gki-certified-boot-android14-6.1-2024-01_r1.zip
            unzip gki.zip && rm gki.zip
            $UNPACK_BOOTIMG --boot_img=boot.img
          else
            echo "请替换为小米15 Pro对应安卓版本的ramdisk！"
            exit 1
          fi
          # 打包boot.img并签名
          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img --ramdisk out/ramdisk --os_version ${{ inputs.android_version }} --os_patch_level ${{ inputs.os_patch_level }}
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp boot.img ../Xiaomi15Pro-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-boot.img
          # 生成gz/lz4版本boot.img
          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img --ramdisk out/ramdisk --os_version ${{ inputs.android_version }} --os_patch_level ${{ inputs.os_patch_level }}
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp boot-gz.img ../Xiaomi15Pro-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-boot-gz.img

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi15Pro-Kernel-${{ inputs.kernel_version }}
          path: |
            *AnyKernel3.zip
            *.img
            bootimgs/*
