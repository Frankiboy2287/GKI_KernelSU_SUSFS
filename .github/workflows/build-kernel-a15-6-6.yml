name: 编译小米15Pro A15-6.6内核 (添加TMPFS配置)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # 新增：小米15Pro内核defconfig文件名，必须核对源码后填写
      mi_defconfig:
        description: "小米15Pro内核defconfig文件名(arch/arm64/configs下)"
        required: true
        type: string
        default: "dada_defconfig"
      version:
        description: '自定义版本名(如位于6.6.77-android15-8<自定义版本名>/留空则使用默认版本号)'
        required: false
        type: string
      build_time:
        description: '设置内核构建时间(格式见仓库说明)'
        required: false
        type: string
      use_zram:
        description: '是否开启更多ZRAM算法?'
        required: true
        type: boolean
        default: true
      onlyAk3:
        description: '仅上传AK3压缩包?(无boot,下载更快)'
        required: false
        type: boolean
        default: false
      # 移除所有 KernelSU/BBG/KPM/一加8E/get_manager 相关输入项

jobs:
  # 修改任务名和调用的工作流目标
  build-xiaomi15pro-a15-6-6:
    uses: ./.github/workflows/Android 15 6.6.yml  # 替换为你修改后的工作流文件名
    secrets: inherit
    with:
      make_release: false
      # 传递新增的defconfig参数
      mi_defconfig: ${{ inputs.mi_defconfig }}
      version: ${{ inputs.version }}
      use_zram: ${{ inputs.use_zram }}
      onlyAk3: ${{ inputs.onlyAk3 }}
      build_time: ${{ inputs.build_time }}
      # 移除所有 KernelSU/BBG/KPM/supp_op 相关传参

  # 删除 get-ksu-manager 无用任务
